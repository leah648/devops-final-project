apiVersion: v1
kind: Service
metadata:
  name: hello-world-service
  labels:
    app: hello-world
spec:
  # NodePort chosen for broad compatibility (LoadBalancer may be used in cloud environments)
  type: NodePort
  selector:
    app: hello-world
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      # nodePort: 30080  # Optional: uncomment to fix the NodePort, otherwise cluster will assign one
