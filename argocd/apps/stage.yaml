apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/leah648/devops-final-project.git'
    targetRevision: HEAD
    path: 'helm/hello-world'
    helm:
      valueFiles:
        - 'environments/stage/values.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: hello-world-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
