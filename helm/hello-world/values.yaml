replicaCount: 2

image:
  repository: "<DOCKERHUB_USER>/hello-world"
  tag: "dev"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  nodePort: 30080 # optional; omit or set null to let cluster assign

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 5

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
