apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-world-rollout
  labels:
    app: hello-world
spec:
  # Default replicas; environments should control this via Helm or Argo CD values
  replicas: 2
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: "leahm90/hello-world:<TAG>"
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
  strategy:
    canary:
      # Traffic routing via Kubernetes Service (see rollout/service.yaml)
      steps:
        - setWeight: 20
        - pause: {duration: 30s}
        - setWeight: 50
        - pause: {duration: 30s}
        - setWeight: 100
      trafficRouting:
        service:
          name: hello-world-service
          port: 80
